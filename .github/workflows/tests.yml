name: Tests

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
      # Install only the dependencies: an editable install of the package breaks
      # Home Assistant's custom integration loader, so tests import it from the checkout.
      - name: Install dependencies
        run: uv pip install --system -r pyproject.toml --extra dev
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: python -m pytest
        env:
          PYTHONPATH: .
